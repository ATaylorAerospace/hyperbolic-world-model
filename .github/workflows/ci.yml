name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Everything in CI runs on CPU. Torch is pulled from the CPU wheel index to keep the job small.
  TORCH_INDEX_URL: https://download.pytorch.org/whl/cpu
  HWM_DEVICE: cpu

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Lint
        run: uvx ruff check .
      - name: Format check
        run: uvx ruff format --check .

  test:
    name: pytest (geometry, metrics, tasks, reporting; CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.11
      - name: Install (CPU torch)
        run: |
          uv venv --python 3.11
          uv pip install torch --index-url "$TORCH_INDEX_URL"
          uv pip install -e ".[dev]"
      - name: Unit tests (geometry, metrics, tasks and reporting)
        run: uv run --no-sync pytest tests/geometry tests/metrics tests/tasks tests/reporting -v

  smoke:
    name: smoke benchmark (CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.11
      - name: Install (CPU torch)
        run: |
          uv venv --python 3.11
          uv pip install torch --index-url "$TORCH_INDEX_URL"
          uv pip install -e ".[dev]"
      - name: Run the smoke experiment end to end
        run: uv run --no-sync bash scripts/run_smoke.sh
      - name: Upload smoke outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-outputs
          path: outputs/smoke
          if-no-files-found: warn
